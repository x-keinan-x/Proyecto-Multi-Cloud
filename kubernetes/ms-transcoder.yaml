apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-transcoder-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-transcoder
  template:
    metadata:
      labels:
        app: ms-transcoder
    spec:
      containers:
      - name: video-transcoder
        image: tu-usuario-docker/ms-transcoder:latest # REEMPLAZAR AQUÍ
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m" # Permitimos usar hasta 1 núcleo completo
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-transcoder-service
spec:
  type: ClusterIP
  selector:
    app: ms-transcoder
  ports:
  - port: 80
    targetPort: 5000