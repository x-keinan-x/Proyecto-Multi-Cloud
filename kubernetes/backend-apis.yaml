apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-catalog-deployment
  namespace: default
  labels:
    app: ms-catalog
spec:
  replicas: 2 # Iniciamos con 2 pods para Alta Disponibilidad
  selector:
    matchLabels:
      app: ms-catalog
  template:
    metadata:
      labels:
        app: ms-catalog
    spec:
      containers:
      - name: catalog-api
        image: tu-usuario-docker/ms-catalog-api:latest # REEMPLAZAR AQUÍ
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: edtech-config
        - secretRef:
            name: edtech-secrets
        resources:
          requests:
            cpu: "250m" # Equivalente a 1/4 de un núcleo de tu máquina EC2
            memory: "256Mi"
          limits:
            cpu: "500m" # El HPA se activará cuando supere el 70% de este valor
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-catalog-service
spec:
  type: ClusterIP # Solo accesible desde dentro del cluster
  selector:
    app: ms-catalog
  ports:
  - port: 80
    targetPort: 8080